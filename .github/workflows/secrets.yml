# Gitleaks on the commits of the pull request or push, for projects that do not
# use symfony-app.yml (which runs the same job). Callers trigger it from their
# own CI workflow.
name: Secrets

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # No concurrency group: a pending run cancelled by a newer push would leave
  # its commit range unscanned, since each run only scans its own range.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Commit range
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push creating a branch has no "before": scan the pushed commit only.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "log-opts=-1 $HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "log-opts=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git --log-opts="${{ steps.range.outputs.log-opts }}" --redact -v /repo
