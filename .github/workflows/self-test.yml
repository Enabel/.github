name: Self-test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # yq is preinstalled on ubuntu-latest; this run is what proves it.
      - run: yq --version
      # The runner is throwaway: let the tests really pip-install a package.
      - run: make test YQ=yq
        env:
          RUN_PIP_INTEGRATION: 1
